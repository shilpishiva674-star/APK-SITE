<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hariom MOD Hub</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --bg: #0a0a0a;
      --card: #111111;
      --text: #00ff00;
      --border: #00ff00;
      --glow: 0 0 10px #00ff00;
      --accent: #00ff88;
    }
    
    body.light {
      --bg: #f0f0f0;
      --card: #ffffff;
      --text: #008000;
      --border: #008000;
      --glow: 0 0 10px #008000;
      --accent: #00aa00;
    }
    
    body {
      font-family: 'Courier New', monospace;
      background: var(--bg);
      color: var(--text);
      transition: all 0.3s;
    }
    
    /* Splash Screen */
    .splash {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #000; display: flex; align-items: center; justify-content: center;
      flex-direction: column; z-index: 9999; animation: hideSplash 0.5s ease 3s forwards;
    }
    .splash-text {
      font-size: 2rem; text-shadow: var(--glow); animation: flicker 1.5s infinite;
    }
    .loading-bar {
      width: 200px; height: 4px; background: #222; margin-top: 20px;
      border: 1px solid var(--border); position: relative; overflow: hidden;
    }
    .loading-bar::after {
      content: ''; position: absolute; height: 100%; width: 40%;
      background: var(--text); animation: loading 2s ease infinite;
    }
    @keyframes loading { 0%{left:-40%} 100%{left:100%} }
    @keyframes flicker { 0%,100%{opacity:1} 50%{opacity:0.3} }
    @keyframes hideSplash { to{opacity:0; visibility:hidden} }
    
    /* Matrix Background */
    .matrix {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; opacity: 0.08; z-index: 0;
    }
    .matrix-line {
      position: absolute; width: 1px; height: 100%;
      background: linear-gradient(transparent, var(--text), transparent);
      animation: fall linear infinite;
    }
    @keyframes fall { from{transform:translateY(-100%)} to{transform:translateY(100%)} }
    
    /* Header */
    .header {
      background: var(--card); padding: 15px 20px; display: flex;
      align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--border); box-shadow: var(--glow);
      position: sticky; top: 0; z-index: 100;
    }
    .menu-btn {
      background: none; border: 1px solid var(--border); color: var(--text);
      width: 40px; height: 40px; border-radius: 8px; cursor: pointer;
      box-shadow: var(--glow);
    }
    .logo { font-size: 1.3rem; font-weight: bold; text-shadow: var(--glow); }
    
    /* Drawer */
    .drawer {
      position: fixed; top: 0; left: -300px; width: 280px; height: 100%;
      background: var(--card); border-right: 1px solid var(--border);
      transition: 0.3s; z-index: 200; padding: 20px; box-shadow: var(--glow);
    }
    .drawer.open { left: 0; }
    .drawer-header { margin-bottom: 30px; text-shadow: var(--glow); }
    .drawer-item {
      padding: 12px; margin: 8px 0; border: 1px solid var(--border);
      border-radius: 8px; cursor: pointer; transition: 0.2s;
    }
    .drawer-item:hover { background: rgba(0,255,0,0.1); box-shadow: var(--glow); }
    .overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7); z-index: 150; display: none;
    }
    .overlay.show { display: block; }
    
    /* Main */
    .container { padding: 20px; max-width: 800px; margin: 0 auto; position: relative; z-index: 1; }
    
    .search-box {
      width: 100%; padding: 15px; background: var(--card);
      border: 1px solid var(--border); border-radius: 12px;
      color: var(--text); font-family: inherit; font-size: 1rem;
      box-shadow: var(--glow); margin-bottom: 25px;
    }
    
    .upload-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 15px; padding: 30px; text-align: center;
      box-shadow: var(--glow); margin-bottom: 20px;
    }
    
    .file-input { display: none; }
    
    /* Glossy Green Button */
    .glossy-btn {
      background: linear-gradient(180deg, #00ff00 0%, #00cc00 50%, #009900 100%);
      color: #000; border: none; padding: 15px 40px; border-radius: 12px;
      font-family: inherit; font-size: 1rem; font-weight: bold; cursor: pointer;
      position: relative; overflow: hidden; box-shadow: 0 4px 15px rgba(0,255,0,0.4);
      transition: 0.3s; text-transform: uppercase; margin: 5px;
    }
    .glossy-btn::before {
      content: ''; position: absolute; top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: linear-gradient(45deg, transparent, rgba(255,255,255,0.3), transparent);
      transform: rotate(45deg); animation: shine 3s infinite;
    }
    .glossy-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,255,0,0.6); }
    @keyframes shine { 0%{left:-50%} 100%{left:150%} }
    
    .apk-card {
      background: rgba(0,255,0,0.05); padding: 15px; margin: 12px 0;
      border-left: 3px solid var(--border); border-radius: 8px;
      display: flex; align-items: center; gap: 15px; text-align: left;
    }
    .apk-icon {
      width: 50px; height: 50px; background: var(--card);
      border: 1px solid var(--border); border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem; box-shadow: var(--glow);
    }
    .apk-info { flex: 1; }
    .apk-name { font-weight: bold; margin-bottom: 5px; }
    .apk-size { font-size: 0.85rem; opacity: 0.7; }
    .download-btn {
      background: var(--accent); color: #000; border: none;
      padding: 8px 15px; border-radius: 6px; cursor: pointer;
      font-family: inherit; font-weight: bold;
    }
    
    .theme-toggle {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px; border: 1px solid var(--border); border-radius: 8px;
    }
    .switch {
      width: 50px; height: 25px; background: #333; border-radius: 25px;
      position: relative; cursor: pointer; border: 1px solid var(--border);
    }
    .switch::after {
      content: ''; position: absolute; width: 21px; height: 21px;
      background: var(--text); border-radius: 50%; top: 1px; left: 1px;
      transition: 0.3s; box-shadow: var(--glow);
    }
    body.light .switch::after { left: 26px; }
    
    .stats {
      display: grid; grid-template-columns: repeat(2,1fr); gap: 15px; margin-top: 20px;
    }
    .stat-box {
      background: var(--card); border: 1px solid var(--border);
      padding: 15px; border-radius: 10px; text-align: center; box-shadow: var(--glow);
    }
    .stat-num { font-size: 1.8rem; font-weight: bold; text-shadow: var(--glow); }
  </style>
</head>
<body>
  <!-- Splash -->
  <div class="splash">
    <div class="splash-text">> HARIOM MOD HUB_</div>
    <div class="loading-bar"></div>
  </div>
  
  <!-- Matrix -->
  <div class="matrix" id="matrix"></div>
  
  <!-- Drawer -->
  <div class="overlay" id="overlay" onclick="toggleDrawer()"></div>
  <div class="drawer" id="drawer">
    <div class="drawer-header"><h2>> MENU_</h2></div>
    <div class="drawer-item"><i class="fas fa-home"></i> Dashboard</div>
    <div class="drawer-item"><i class="fas fa-upload"></i> Upload APK</div>
    <div class="drawer-item"><i class="fas fa-gamepad"></i> MOD Library</div>
    <div class="drawer-item"><i class="fas fa-code"></i> Termux Scripts</div>
    <div class="theme-toggle">
      <span><i class="fas fa-moon"></i> Dark/Light</span>
      <div class="switch" onclick="toggleTheme()"></div>
    </div>
  </div>
  
  <!-- Header -->
  <div class="header">
    <button class="menu-btn" onclick="toggleDrawer()"><i class="fas fa-bars"></i></button>
    <div class="logo">MOD_HUB.EXE</div>
    <div style="width:40px"></div>
  </div>
  
  <!-- Main -->
  <div class="container">
    <input type="text" class="search-box" placeholder="> Search MODs, APKs, Scripts..." id="searchInput">
    
    <div class="upload-card">
      <h2 style="margin-bottom:20px; text-shadow: var(--glow);">> UPLOAD_APK_FILES</h2>
      <input type="file" id="fileInput" class="file-input" multiple accept=".apk,.txt,.csv,.zip">
      <button class="glossy-btn" onclick="document.getElementById('fileInput').click()">
        <i class="fas fa-upload"></i> SELECT APK
      </button>
      <button class="glossy-btn" onclick="uploadToServer()">
        <i class="fas fa-cloud-upload-alt"></i> UPLOAD ALL
      </button>
      
      <div class="stats">
        <div class="stat-box">
          <div class="stat-num" id="totalFiles">0</div>
          <div>Total Files</div>
        </div>
        <div class="stat-box">
          <div class="stat-num" id="totalSize">0 MB</div>
          <div>Total Size</div>
        </div>
      </div>
      
      <div id="fileList" style="margin-top:20px;"></div>
    </div>
  </div>

  <script>
    let uploadedFiles = [];
    
    // Matrix Effect
    const matrix = document.getElementById('matrix');
    for(let i=0; i<50; i++) {
      const line = document.createElement('div');
      line.className = 'matrix-line';
      line.style.left = Math.random()*100 + '%';
      line.style.animationDuration = (Math.random()*3 + 2) + 's';
      line.style.animationDelay = Math.random()*2 + 's';
      matrix.appendChild(line);
    }
    
    function toggleDrawer() {
      document.getElementById('drawer').classList.toggle('open');
      document.getElementById('overlay').classList.toggle('show');
    }
    
    function toggleTheme() {
      document.body.classList.toggle('light');
      localStorage.setItem('theme', document.body.classList.contains('light') ? 'light' : 'dark');
    }
    
    if(localStorage.getItem('theme') === 'light') {
      document.body.classList.add('light');
    }
    
    // File Upload Handler
    document.getElementById('fileInput').addEventListener('change', function(e) {
      const fileList = document.getElementById('fileList');
      
      for(let file of e.target.files) {
        uploadedFiles.push(file);
        
        const div = document.createElement('div');
        div.className = 'apk-card';
        
        const isAPK = file.name.endsWith('.apk');
        const icon = isAPK ? 'fa-android' : 'fa-file';
        const sizeMB = (file.size / (1024*1024)).toFixed(2);
        
        div.innerHTML = `
          <div class="apk-icon"><i class="fab ${icon}"></i></div>
          <div class="apk-info">
            <div class="apk-name">${file.name}</div>
            <div class="apk-size">Size: ${sizeMB} MB | Type: ${file.type || 'application/apk'}</div>
          </div>
          <button class="download-btn" onclick="downloadFile('${file.name}')">
            <i class="fas fa-download"></i>
          </button>
        `;
        fileList.appendChild(div);
      }
      
      updateStats();
    });
    
    function updateStats() {
      document.getElementById('totalFiles').textContent = uploadedFiles.length;
      const totalMB = uploadedFiles.reduce((sum, f) => sum + f.size, 0) / (1024*1024);
      document.getElementById('totalSize').textContent = totalMB.toFixed(2) + ' MB';
    }
    
    function downloadFile(name) {
      alert('> Download started: ' + name + '\n\nNote: Ye demo hai. Real me Firebase/Server lagana padega.');
    }
    
    function uploadToServer() {
      if(uploadedFiles.length === 0) {
        alert('> ERROR: Pehle files select karo!');
        return;
      }
      alert(`> UPLOADING ${uploadedFiles.length} FILES...\n\nBackend chahiye? Firebase setup kar du?`);
      // Yaha tu Firebase ya apna server ka code daal sakta hai
    }
    
    document.getElementById('searchInput').addEventListener('input', function(e) {
      const term = e.target.value.toLowerCase();
      document.querySelectorAll('.apk-card').forEach(card => {
        const name = card.querySelector('.apk-name').textContent.toLowerCase();
        card.style.display = name.includes(term) ? 'flex' : 'none';
      });
    });
  </script>
</body>
</html>

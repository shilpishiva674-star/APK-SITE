<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Hariom Modder Hub</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .login-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px; padding: 40px 30px;
      width: 100%; max-width: 400px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }
    .logo { text-align: center; margin-bottom: 10px; }
    .logo img { width: 70px; height: 70px; border-radius: 12px; }
    h1 { color: #fff; text-align: center; font-size: 2rem; margin-bottom: 5px; }
    .subtitle { color: rgba(255, 255, 255, 0.7); text-align: center; 
      margin-bottom: 30px; font-size: 0.95rem; }
    
    .input-group { position: relative; margin-bottom: 20px; }
    .input-field {
      width: 100%; padding: 15px 45px 15px 15px; border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1); 
      background: rgba(255, 255, 255, 0.08);
      color: #fff; font-size: 16px; outline: none;
      transition: all 0.3s;
    }
    .input-field::placeholder { color: rgba(255, 255, 255, 0.5); }
    .input-field:focus { 
      border-color: #667eea; 
      box-shadow: 0 0 20px rgba(102, 126, 234, 0.3);
    }
    .input-icon {
      position: absolute; right: 15px; top: 50%; transform: translateY(-50%);
      color: rgba(255, 255, 255, 0.5); font-size: 18px;
    }
    
    .login-btn {
      width: 100%; padding: 15px; border-radius: 12px; border: none;
      background: linear-gradient(90deg, #667eea, #764ba2);
      color: #fff; font-size: 16px; font-weight: 700; cursor: pointer;
      transition: all 0.3s; margin-top: 10px;
    }
    .login-btn:hover { 
      transform: translateY(-2px); 
      box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
    }
    
    .links { text-align: center; margin-top: 20px; color: rgba(255, 255, 255, 0.7); }
    .links a { color: #fff; text-decoration: none; font-size: 0.9rem; }
    .links a:hover { color: #667eea; }
    .divider { margin: 0 8px; }
    .active-account { text-align: center; margin-top: 15px; color: rgba(255, 255, 255, 0.7); }
    
    .whatsapp-popup {
      position: fixed; bottom: 20px; right: 20px;
      background: #25D366; border-radius: 12px; padding: 15px;
      display: flex; align-items: center; gap: 12px; 
      box-shadow: 0 5px 20px rgba(37, 211, 102, 0.4);
      animation: slideUp 0.5s ease;
    }
    @keyframes slideUp { from { transform: translateY(100px); opacity: 0; } }
    .whatsapp-popup .close { cursor: pointer; color: #fff; font-size: 20px; }
    .whatsapp-text { color: #fff; }
    .whatsapp-text strong { display: block; font-size: 0.95rem; }
    .whatsapp-text span { font-size: 0.8rem; opacity: 0.9; }
    .join-btn {
      background: #fff; color: #25D366; padding: 8px 16px; border-radius: 20px;
      border: none; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo">
      <img src="logo.png" alt="Hariom Modder">
    </div>
    <h1>Hariom Modder</h1>
    <p class="subtitle">Premium MODs Portal</p>
    
    <form id="loginForm">
      <div class="input-group">
        <input type="text" class="input-field" placeholder="Email or Mobile Number" required>
        <i class="fas fa-envelope input-icon"></i>
      </div>
      
      <div class="input-group">
        <input type="password" class="input-field" placeholder="Password" required>
        <i class="fas fa-lock input-icon"></i>
      </div>
      
      <button type="submit" class="login-btn">
        Login Now
      </button>
    </form>
    
    <div class="links">
      <a href="#">Forgot password?</a>
      <span class="divider">•</span>
      <a href="#">Create account</a>
    </div>
    
    <div class="active-account">
      <a href="#" style="color: rgba(255,255,255,0.7); text-decoration: none;">Active My Account</a>
    </div>
  </div>

  <div class="whatsapp-popup" id="whatsappPopup">
    <i class="fab fa-whatsapp" style="font-size: 32px; color: #fff;"></i>
    <div class="whatsapp-text">
      <strong>📢 Join Our Channel</strong>
      <span>Instant updates & offers</span>
    </div>
    <button class="join-btn" onclick="window.open('https://wa.me/')">
      <i class="fab fa-whatsapp"></i> Join
    </button>
    <span class="close" onclick="document.getElementById('whatsappPopup').style.display='none'">&times;</span>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      alert('Login System: Backend connect karna padega bhai 🔐');
    });
    
    // 5 sec baad popup hide kar de
    setTimeout(() => {
      document.getElementById('whatsappPopup').style.display = 'none';
    }, 8000);
  </script>
</body>
</html>
